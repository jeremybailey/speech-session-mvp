name: Condition workflow recovery
on:
  pull_request:
    paths: ['vercel-openai-proxy/**', '.github/workflows/condition-recovery.yml']
  push:
    paths: ['vercel-openai-proxy/**', '.github/workflows/condition-recovery.yml']
permissions:
  contents: read
jobs:
  synthetic-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: cc_test_workflows
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d cc_test_workflows"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: vercel-openai-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vercel-openai-proxy/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:condition-recovery
        env:
          AI_WORKFLOW_TEST_DATABASE_URL: postgresql://test:synthetic-only@127.0.0.1:5432/cc_test_workflows
